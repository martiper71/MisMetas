<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pad-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c362e"/>
      <stop offset="100%" stop-color="#18201a"/>
    </linearGradient>
    <filter id="pad-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#1e2621" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#pad-shadow)">
    <!-- Cuerpo Mando Gamepad ergonómico -->
    <path d="M90 70 C140 70 160 90 190 90 C220 90 240 70 290 70 C340 70 370 115 360 210 C355 255 320 275 285 240 L255 195 C235 185 210 185 190 185 C170 185 145 185 125 195 L95 240 C60 275 25 255 20 210 C10 115 40 70 90 70 Z" fill="url(#pad-body)" stroke="#49574c" stroke-width="2.5"/>
    
    <!-- Touchpad central / Luz LED verde -->
    <rect x="145" y="85" width="90" height="55" rx="8" fill="#1b211c" stroke="#315e49" stroke-width="2"/>
    <rect x="150" y="87" width="80" height="3" rx="1.5" fill="#719179"/>
    
    <!-- D-Pad (Cruceta izquierda) -->
    <path d="M95 110 H115 V125 H130 V145 H115 V160 H95 V145 H80 V125 H95 Z" fill="#3f4f43" stroke="#252f28" stroke-width="1.5"/>
    
    <!-- Botones de acción derecha -->
    <circle cx="285" cy="115" r="9" fill="#3f4f43" stroke="#252f28" stroke-width="1"/>
    <circle cx="265" cy="135" r="9" fill="#3f4f43" stroke="#252f28" stroke-width="1"/>
    <circle cx="305" cy="135" r="9" fill="#3f4f43" stroke="#252f28" stroke-width="1"/>
    <circle cx="285" cy="155" r="9" fill="#3f4f43" stroke="#252f28" stroke-width="1"/>
    <!-- Símbolo X/O en verde esmeralda -->
    <circle cx="285" cy="155" r="4" fill="#719179"/>
    
    <!-- Joysticks analógicos con textura -->
    <circle cx="140" cy="180" r="24" fill="#171c18" stroke="#334035" stroke-width="2"/>
    <circle cx="140" cy="180" r="16" fill="#315e49"/>
    <circle cx="240" cy="180" r="24" fill="#171c18" stroke="#334035" stroke-width="2"/>
    <circle cx="240" cy="180" r="16" fill="#315e49"/>
  </g>
</svg>
