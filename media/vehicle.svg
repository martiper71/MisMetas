<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="car-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#244234"/>
      <stop offset="50%" stop-color="#315e49"/>
      <stop offset="100%" stop-color="#41735a"/>
    </linearGradient>
    <filter id="car-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#1e2621" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#car-shadow)">
    <!-- Silueta aerodinámica coupé / deportivo -->
    <path d="M40 185 C40 175 45 168 55 168 H85 L120 100 C128 85 145 78 165 78 H250 C270 78 285 88 295 105 L325 165 H355 C365 165 372 173 372 185 V200 C372 205 368 210 362 210 H345 C345 180 320 155 290 155 C260 155 235 180 235 210 H165 C165 180 140 155 110 155 C80 155 55 180 55 210 H38 C32 210 28 205 28 200 V185 Z" fill="url(#car-body)" stroke="#1a3328" stroke-width="2.5"/>
    
    <!-- Ventanas / Parabrisas con tinte oscuro -->
    <path d="M130 105 C135 95 145 90 160 90 H200 V155 H98 Z" fill="#1b2921" stroke="#3b4d42" stroke-width="1.5"/>
    <path d="M210 90 H245 C258 90 268 98 275 110 L298 155 H210 Z" fill="#1b2921" stroke="#3b4d42" stroke-width="1.5"/>
    
    <!-- Faros delanteros y traseros LED -->
    <path d="M355 170 L370 174 L365 185 Z" fill="#e8f5e9" stroke="#81c784" stroke-width="1"/>
    <path d="M40 172 L50 172 L50 182 L40 182 Z" fill="#e57373"/>
    
    <!-- Rueda Delantera -->
    <circle cx="290" cy="210" r="32" fill="#1c211e" stroke="#48574d" stroke-width="3"/>
    <circle cx="290" cy="210" r="18" fill="#d0d6cc" stroke="#7e8a7d" stroke-width="2"/>
    <circle cx="290" cy="210" r="6" fill="#315e49"/>
    
    <!-- Rueda Trasera -->
    <circle cx="110" cy="210" r="32" fill="#1c211e" stroke="#48574d" stroke-width="3"/>
    <circle cx="110" cy="210" r="18" fill="#d0d6cc" stroke="#7e8a7d" stroke-width="2"/>
    <circle cx="110" cy="210" r="6" fill="#315e49"/>
  </g>
</svg>
