<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <linearGradient id="watch-strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d3d32"/>
      <stop offset="50%" stop-color="#415748"/>
      <stop offset="100%" stop-color="#2d3d32"/>
    </linearGradient>
    <linearGradient id="watch-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18201a"/>
      <stop offset="100%" stop-color="#243328"/>
    </linearGradient>
    <filter id="watch-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1e2621" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#watch-shadow)">
    <!-- Correa superior -->
    <path d="M105 15 C105 10 110 5 115 5 H205 C210 5 215 10 215 15 V110 H105 Z" fill="url(#watch-strap)"/>
    <!-- Correa inferior -->
    <path d="M105 310 H215 V405 C215 410 210 415 205 415 H115 C110 415 105 410 105 405 Z" fill="url(#watch-strap)"/>
    <!-- Caja de titanio/aluminio -->
    <rect x="70" y="90" width="180" height="235" rx="50" fill="#1b1e1b" stroke="#484f45" stroke-width="3"/>
    <!-- Corona Digital lateral -->
    <rect x="250" y="130" width="12" height="48" rx="5" fill="#315e49" stroke="#5c7a65" stroke-width="1.5"/>
    <!-- Botón lateral inferior -->
    <rect x="250" y="205" width="8" height="50" rx="4" fill="#2d332b"/>
    <!-- Pantalla OLED Always-On -->
    <rect x="85" y="105" width="150" height="205" rx="40" fill="url(#watch-face)"/>
    <!-- Esfera deportiva / Anillos de actividad -->
    <circle cx="160" cy="207" r="55" stroke="#e65100" stroke-width="7" fill="none" opacity="0.3"/>
    <circle cx="160" cy="207" r="55" stroke="#ff7043" stroke-width="7" fill="none" stroke-dasharray="240 100" stroke-linecap="round"/>
    <circle cx="160" cy="207" r="42" stroke="#2e7d32" stroke-width="7" fill="none" opacity="0.3"/>
    <circle cx="160" cy="207" r="42" stroke="#719179" stroke-width="7" fill="none" stroke-dasharray="190 70" stroke-linecap="round"/>
    <circle cx="160" cy="207" r="29" stroke="#0277bd" stroke-width="7" fill="none" opacity="0.3"/>
    <circle cx="160" cy="207" r="29" stroke="#4fc3f7" stroke-width="7" fill="none" stroke-dasharray="130 50" stroke-linecap="round"/>
    <!-- Hora digital -->
    <text x="160" y="213" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">09:41</text>
  </g>
</svg>
