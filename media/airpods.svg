<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ap-mesh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#415749"/>
      <stop offset="50%" stop-color="#698572"/>
      <stop offset="100%" stop-color="#415749"/>
    </linearGradient>
    <filter id="ap-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#1e2621" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#ap-shadow)">
    <!-- Diadema de malla transpirable -->
    <path d="M95 190 C95 100 135 60 190 60 C245 60 285 100 285 190" stroke="url(#ap-mesh)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M102 190 C102 110 138 74 190 74 C242 74 278 110 278 190" stroke="#232722" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <!-- Brazos telescópicos de acero -->
    <rect x="74" y="180" width="14" height="60" rx="7" fill="#b9bdb4" stroke="#878b81" stroke-width="1.5"/>
    <rect x="292" y="180" width="14" height="60" rx="7" fill="#b9bdb4" stroke="#878b81" stroke-width="1.5"/>
    
    <!-- Almohadilla izquierda -->
    <rect x="52" y="195" width="58" height="115" rx="28" fill="#2d4233" stroke="#55735c" stroke-width="2.5"/>
    <rect x="42" y="210" width="16" height="85" rx="8" fill="#1b241e"/>
    
    <!-- Almohadilla derecha -->
    <rect x="270" y="195" width="58" height="115" rx="28" fill="#2d4233" stroke="#55735c" stroke-width="2.5"/>
    <rect x="322" y="210" width="16" height="85" rx="8" fill="#1b241e"/>
    
    <!-- Corona Digital en auricular derecho -->
    <rect x="290" y="188" width="16" height="6" rx="2" fill="#719179"/>
  </g>
</svg>
