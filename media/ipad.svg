<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="100%" height="100%">
  <defs>
    <linearGradient id="ipad-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2d22"/>
      <stop offset="60%" stop-color="#315e49"/>
      <stop offset="100%" stop-color="#648870"/>
    </linearGradient>
    <filter id="ipad-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#1e2621" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <g filter="url(#ipad-shadow)">
    <!-- Cuerpo de aluminio iPad -->
    <rect x="35" y="25" width="250" height="365" rx="24" fill="#20231f" stroke="#484d44" stroke-width="2.5"/>
    <!-- Pantalla Liquid Retina -->
    <rect x="49" y="39" width="222" height="337" rx="14" fill="url(#ipad-screen)"/>
    <!-- Ondas de fondo de pantalla -->
    <circle cx="160" cy="210" r="70" fill="#84a68c" opacity="0.4"/>
    <ellipse cx="190" cy="270" rx="90" ry="50" fill="#a8c7b0" opacity="0.25"/>
    <!-- Cámara frontal en bisel -->
    <circle cx="160" cy="32" r="2.5" fill="#586154"/>
    <!-- Barra inferior home indicator -->
    <rect x="125" y="365" width="70" height="3" rx="1.5" fill="#ffffff" opacity="0.7"/>
    <!-- Apple Pencil adosado magnéticamente arriba/lateral -->
    <rect x="288" y="90" width="7" height="230" rx="3.5" fill="#e8eae3" stroke="#b4b7ad" stroke-width="1"/>
    <path d="M288 90 L291.5 75 L295 90 Z" fill="#42473f"/>
  </g>
</svg>
